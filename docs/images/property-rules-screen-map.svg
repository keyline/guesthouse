<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Property Rules administration screen map</title>
  <desc id="desc">Annotated map showing property selection, effective dates, rule editor, guest preview, save draft and publish controls.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter>
    <style>
      .t{font-family:Arial,sans-serif;fill:#0f172a}.muted{fill:#64748b}.label{font-size:15px;font-weight:700}.small{font-size:13px}.num{font-size:17px;font-weight:800;fill:white}.call{font-size:15px;font-weight:700;fill:#1e3a8a}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f1f5f9"/>
  <rect x="30" y="25" width="1140" height="70" rx="13" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="58" y="55" class="t muted small">PROPERTY MANAGEMENT</text><text x="58" y="80" class="t" font-size="25" font-weight="800">Rules · Basera</text>
  <rect x="850" y="42" width="285" height="40" rx="9" fill="#fff" stroke="#94a3b8"/><text x="875" y="68" class="t label">Selected property: Basera</text>

  <rect x="30" y="120" width="760" height="565" rx="14" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="58" y="155" class="t" font-size="20" font-weight="800">Rule set v2</text><rect x="190" y="135" width="65" height="26" rx="13" fill="#fef3c7"/><text x="207" y="153" class="t small" fill="#92400e">DRAFT</text>
  <text x="58" y="181" class="t muted small">Only a published version is visible to guests.</text>
  <rect x="58" y="198" width="340" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="73" y="219" class="t muted small">EFFECTIVE FROM</text><text x="73" y="242" class="t label">Select date (optional)</text>
  <rect x="420" y="198" width="340" height="55" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="435" y="219" class="t muted small">EFFECTIVE UNTIL</text><text x="435" y="242" class="t label">Select date (optional)</text>
  <text x="58" y="293" class="t label">Must-read rules</text>
  <rect x="58" y="310" width="702" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="76" y="338" class="t label">Primary guest minimum age</text><rect x="300" y="324" width="185" height="40" rx="7" fill="white" stroke="#94a3b8"/><text x="316" y="350" class="t small">Minimum 18 years</text><rect x="505" y="324" width="180" height="40" rx="7" fill="white" stroke="#94a3b8"/><text x="520" y="350" class="t small">Guest-facing text</text><rect x="706" y="335" width="18" height="18" rx="3" fill="#0ea5e9"/><path d="m710 344 4 4 7-9" fill="none" stroke="white" stroke-width="2"/>
  <text x="58" y="420" class="t label">Guest profile</text>
  <rect x="58" y="437" width="702" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="76" y="465" class="t label">Unmarried couples</text><rect x="300" y="451" width="185" height="40" rx="7" fill="white" stroke="#94a3b8"/><text x="316" y="477" class="t small">Allowed</text><rect x="505" y="451" width="219" height="40" rx="7" fill="white" stroke="#94a3b8"/><text x="520" y="477" class="t small">Edit wording if needed</text>
  <rect x="58" y="536" width="702" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/><text x="76" y="565" class="t label">Other guest-facing rules</text><text x="76" y="588" class="t muted small">Enter one custom rule per line.</text>
  <rect x="620" y="625" width="140" height="42" rx="9" fill="#0284c7"/><text x="649" y="652" fill="white" font-family="Arial" font-size="15" font-weight="800">Save Draft</text>

  <rect x="820" y="120" width="350" height="405" rx="14" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
  <text x="848" y="151" class="call small">GUEST PREVIEW</text><text x="848" y="181" class="t" font-size="22" font-weight="800">Property Rules</text><text x="848" y="207" class="t muted small">Check-in 12:00 · Check-out 11:00</text>
  <text x="848" y="245" class="t label">Must-read rules</text><text x="858" y="274" class="t small">• Primary guest must be 18 or older.</text><text x="858" y="300" class="t small">• Valid government photo ID is required.</text>
  <text x="848" y="340" class="t label">Guest profile</text><text x="858" y="369" class="t small">• Unmarried couples are welcome.</text>
  <rect x="840" y="435" width="310" height="65" rx="10" fill="#ecfdf5" stroke="#86efac"/><text x="867" y="463" class="t label" fill="#065f46">Publish reviewed draft</text><text x="867" y="485" class="t small" fill="#047857">Makes this version visible to guests.</text>

  <g><circle cx="1110" cy="62" r="16" fill="#2563eb"/><text x="1105" y="68" class="num">1</text><text x="905" y="112" class="call">Choose the correct property first</text></g>
  <g><circle cx="775" cy="225" r="16" fill="#2563eb"/><text x="770" y="231" class="num">2</text></g>
  <g><circle cx="775" cy="345" r="16" fill="#2563eb"/><text x="770" y="351" class="num">3</text></g>
  <g><circle cx="778" cy="646" r="16" fill="#2563eb"/><text x="773" y="652" class="num">4</text></g>
  <g><circle cx="1153" cy="468" r="16" fill="#2563eb"/><text x="1148" y="474" class="num">5</text></g>
</svg>
